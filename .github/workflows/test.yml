name: Test

on:
  push:
    branches:
      - test

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Crystal.Tests/Crystal.Tests.csproj -c Release --nologo
